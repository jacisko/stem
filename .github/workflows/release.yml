name: Release

# Tag a version (e.g. `git tag v0.2.0 && git push --tags`) to build and attach
# installers to a GitHub Release. Linux artifacts MUST build on a Linux runner:
# per-platform optional deps (@img/sharp) only install natively.
on:
  push:
    tags: ['v*']
  # Run by hand (Actions → Release → Run workflow, or `gh workflow run release.yml
  # --ref <branch>`) to build every installer from a branch before tagging; the
  # installers land as workflow artifacts and nothing is published.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux-x64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run dist:linux
      # The artifact tree is what electron-builder's matchers and module collector
      # produced, not a copy of the checkout — issue #12 shipped an AppImage whose
      # pi could not import its own dependencies, and every release up to 0.5.1
      # carried the repository's src/ and tests/ (see the NEVER note in
      # electron-builder.yml). Check both before the tree is sealed into the AppImage.
      - name: Packaged app is sound
        run: |
          app=$(echo release/linux*-unpacked/resources/app)
          node "$app/node_modules/@earendil-works/pi-coding-agent/dist/cli.js" --version
          for stray in src tests ios docs scripts Dockerfile; do
            if [ -e "$app/$stray" ]; then echo "::error::$stray/ leaked into the packaged app"; exit 1; fi
          done
          ls "$app/node_modules/onnxruntime-node/bin/napi-v6"
      # latest-linux.yml is the AppImage's update feed: a running Stem polls it
      # on this release to learn a newer one exists (src/desktop/updates.ts).
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: |
            release/*.AppImage
            release/*.deb
            release/latest-linux.yml

  # Best-effort arm64 lane (native arm runner, so optional deps install natively).
  linux-arm64:
    runs-on: ubuntu-24.04-arm
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run dist:linux -- --arm64
      # The artifact tree is what electron-builder's matchers and module collector
      # produced, not a copy of the checkout — issue #12 shipped an AppImage whose
      # pi could not import its own dependencies, and every release up to 0.5.1
      # carried the repository's src/ and tests/ (see the NEVER note in
      # electron-builder.yml). Check both before the tree is sealed into the AppImage.
      - name: Packaged app is sound
        run: |
          app=$(echo release/linux*-unpacked/resources/app)
          node "$app/node_modules/@earendil-works/pi-coding-agent/dist/cli.js" --version
          for stray in src tests ios docs scripts Dockerfile; do
            if [ -e "$app/$stray" ]; then echo "::error::$stray/ leaked into the packaged app"; exit 1; fi
          done
          ls "$app/node_modules/onnxruntime-node/bin/napi-v6"
      # An arm64 build writes latest-linux-arm64.yml — same feed, per-arch name,
      # so the two lanes never collide on one file.
      - uses: actions/upload-artifact@v4
        with:
          name: linux-arm64
          path: |
            release/*.AppImage
            release/*.deb
            release/latest-linux-arm64.yml

  mac:
    # Standard Apple Silicon runner; release only arm64 installers. Not macos-26:
    # electron-builder's temporary signing keychain will not unlock there
    # (set-key-partition-list: "passphrase not correct").
    runs-on: macos-15
    env:
      # Release builds require signing and notarization. CSC_LINK is the base64 .p12 of the
      # "Developer ID Application" certificate; APPLE_API_KEY is the .p8 of an
      # App Store Connect key (written to disk below), the other two its ids.
      CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      CSC_NAME: 'Awantech s.r.o. (AX23G9CAL9)'
    steps:
      - name: Require Apple Silicon and release credentials
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          test "$(uname -m)" = arm64
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY_ID APPLE_API_ISSUER APPLE_API_KEY_P8; do
            if [ -z "${!name}" ]; then echo "::error::Missing release credential: $name"; exit 1; fi
          done
      # The macOS 26 SDK: the helper's dictation uses SpeechAnalyzer, which the
      # image's default Xcode 16 lacks (the code is gated @available(macOS 26)
      # and still targets macOS 14).
      - name: Select Xcode 26
        run: sudo xcode-select -s /Applications/Xcode_26.3.app && xcrun swiftc --version
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Write the notarization key
        run: |
          umask 077
          printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
      # Sign while electron-builder's temporary signing keychain is available.
      # Stapling fetches the ticket from Apple's CloudKit, and the connection
      # from GitHub's macOS runners drops now and then (Error 68, "The network
      # connection was lost") after Apple has already accepted the app. Build
      # again rather than fail the release on it.
      - name: Build, sign and notarize
        run: |
          for attempt in 1 2 3; do
            if npm run dist:mac -- --arm64 --config.forceCodeSigning=true --config.dmg.sign=true; then exit 0; fi
            echo "::warning::dist:mac failed (attempt $attempt)"
            rm -rf release
            sleep 30
          done
          exit 1
      - name: Verify signed and notarized app
        run: |
          app=release/mac-arm64/Stem.app
          test "$(lipo -archs "$app/Contents/MacOS/Stem")" = arm64
          codesign --verify --deep --strict --verbose=2 "$app"
          # validate asks Apple's CloudKit too; see the build step above.
          for attempt in 1 2 3 4 5 6; do
            if xcrun stapler validate "$app"; then break; fi
            if [ "$attempt" = 6 ]; then exit 1; fi
            sleep 20
          done
          spctl --assess --type execute --verbose=4 "$app"
      - name: Notarize and verify final DMG
        run: bash scripts/notarize-mac-dmg.sh release/*-arm64.dmg
      # Stapling changed the DMG bytes after electron-builder wrote the feed;
      # re-hash so latest-mac.yml describes the files actually published.
      - name: Refresh the update feed
        run: node scripts/refresh-mac-update-feed.mjs release/latest-mac.yml
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          if-no-files-found: error
          # latest-mac.yml + the zip (and its blockmap, for differential
          # downloads) are what a mac install in /Applications updates from
          # (src/desktop/updates.ts). The zip is untouched by stapling, so its
          # blockmap stays valid; the DMG's does not and is left out.
          path: |
            release/*-arm64.dmg
            release/*-arm64-mac.zip
            release/*-arm64-mac.zip.blockmap
            release/latest-mac.yml
      - name: Remove temporary notarization key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      # Unsigned: no Windows code-signing certificate yet (see the `win` block
      # in electron-builder.yml).
      - run: npm run dist:win
      - name: Packaged app is sound
        shell: bash
        run: |
          app=release/win-unpacked/resources/app
          node "$app/node_modules/@earendil-works/pi-coding-agent/dist/cli.js" --version
          for stray in src tests ios docs scripts Dockerfile; do
            if [ -e "$app/$stray" ]; then echo "::error::$stray/ leaked into the packaged app"; exit 1; fi
          done
          ls "$app/node_modules/onnxruntime-node/bin/napi-v6"
      # latest.yml + the installer's blockmap are what an installed Stem
      # updates from (src/desktop/updates.ts).
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          if-no-files-found: error
          path: |
            release/Stem-Setup-*.exe
            release/Stem-Setup-*.exe.blockmap
            release/latest.yml

  publish:
    needs: [linux-x64, linux-arm64, mac, windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          draft: false
          generate_release_notes: true

  # The server image, for docker-compose.yml's `stem` service and the updater
  # that upgrades it (src/server/upgrade.ts). Built natively per arch — native
  # deps under QEMU take the better part of an hour — pushed by digest, then
  # joined into one multi-arch tag below. Only on a tag: the updater pulls the
  # version a client runs, so every published tag has to be a real release.
  server-image:
    if: startsWith(github.ref, 'refs/tags/')
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: |
            STEM_GIT_SHA=${{ github.sha }}
            STEM_RELEASE_IMAGE=1
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/stem-server,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=server-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=server-${{ matrix.platform }}
      - name: Record the digest
        run: |
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/upload-artifact@v4
        with:
          name: server-digest-${{ strategy.job-index }}
          path: digests/*
          if-no-files-found: error

  server-image-manifest:
    needs: [server-image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: server-digest-*
          path: digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag the release and latest
        working-directory: digests
        run: |
          image="ghcr.io/${OWNER,,}/stem-server"
          version="${GITHUB_REF_NAME#v}"
          docker buildx imagetools create -t "$image:$version" -t "$image:latest" \
            $(printf "$image@sha256:%s " *)
        env:
          OWNER: ${{ github.repository_owner }}
